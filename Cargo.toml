[package]
name = "device_rust"
version = "0.4.0"
authors = ["Zeeshan Iqbal <zeeshan.iqbal.cs@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "device_rust"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[dependencies]
log = "0.4"
anyhow = "1.0.104"
embedded-graphics = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[features]
default = ["serial-buttons"]
# Accept BTN:LEFT / BTN:RIGHT / BTN:PAIR on the serial console (no physical buttons needed).
serial-buttons = []

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = { version = "0.53.0", features = ["critical-section", "embassy-sync"] }
esp32-nimble = "0.13"

[build-dependencies]
embuild = { version = "0.33.7", features = ["espidf"] }
