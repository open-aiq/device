name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host quality gates
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the Xtensa "esp" toolchain for firmware builds;
      # the host library checks run on stable.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --lib --target x86_64-unknown-linux-gnu
      - run: cargo clippy --lib --target x86_64-unknown-linux-gnu -- -D warnings

  firmware:
    name: ESP32-S3 (${{ matrix.oled }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oled: [sh1106, ssd1306]
    env:
      OLED_CONTROLLER: ${{ matrix.oled }}
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
